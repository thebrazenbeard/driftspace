# Disposable local-only tests. No real player worlds, model endpoints or secrets.
name: Driftspace source regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driftspace-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact public REALM host contract
        uses: actions/checkout@v4
        with:
          repository: thebrazenbeard/REALM
          ref: 77e46517b5ea5d44e2dcbc408211dadc7c7808a1
          path: _qualified_realm
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile sources
        shell: bash
        run: python -m compileall -q driftspace tests tools
      - name: Standard library unit suite
        shell: bash
        run: python -m unittest discover -s tests -q
      - name: Optimized assertions retained
        shell: bash
        run: python -O -m unittest discover -s tests -q
      - name: Real authenticated REALM channel epoch regression
        shell: bash
        run: python tools/verify_realm_channel_revision.py --realm-src _qualified_realm/src
      - name: Optimized authenticated REALM channel regression
        shell: bash
        run: python -O tools/verify_realm_channel_revision.py --realm-src _qualified_realm/src
